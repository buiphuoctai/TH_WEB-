<body>
    <p id="student-info" style="font: 16px Arial, sans-serif; color: #222;">Họ tên: <strong>Bùi Phước Tài</strong> — MSSV: <strong>24691051</strong></p>
    <button id="btnInc">Increment</button>
    <span id="count">So lan click: </span>

    <script>
        var btnInc = document.getElementById('btnInc');
        var countEle = document.getElementById('count');
        var count = 0;

        function fn() {
            count++;
            countEle.innerText = count;
        }

        btnInc.onclick = fn
    </script>
</body>
